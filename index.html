<style>
    :root {
        --dill: #4CAF50;
        --lime: #B6D64A;
        --cream: #FFF3D6;
        --black: #1A1A1A;
        --pink: #FF8BC7;
        --darkG: #1b3b22;
    }

    body {
        margin: 0;
        background: var(--dill);
        font-family: 'luckiest guy';
        color: var(--dill);
        text-align: center;
        padding: 0.5em 0.2em;

    header img.qr {

    }

    h1 {
        font-family: 'luckiest guy';
        font-size: 3em;

    }

    p {
        font-size: 1.4em;
        font-family: 'Luckiest Guy';
        color: var(--pink);
    }

    .logo-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
        margin-top: 2em;
    }

    .logo-grid img {
        width: 220px;
        height: 280px;
        border: 3px solid var(--pink);
        border-radius: 10px;
        background: var(--pink);
    }

    .links { 
      margin-top: 2em; 
    } 
    
    .links a { 
      display: inline-block; 
      margin: 1em; 
      padding: 0.7em 1.4em; 
      border: 2px solid var(--pink); 
      border-radius: 6px; 
      color: var(--cream); 
      text-decoration: none; 
      font-size: 1.3em; 
      background: linear-gradient(135deg, var(--dill), var(--lime)); 
      transition: background 0.1s ease; /* Makes the push feel responsive */
    } 

    .links a:hover {
        color: var(--pink);
        background: linear-gradient(360deg, var(--pink), var(--cream));
    }
    .links a:active {
      background: linear-gradient(135deg, var(--darkG), var(--lime));
      color: var(--dill);
      border-color: var(--lime); /* Optional: changes border to match */
    }
</style>
