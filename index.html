<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRINE‑iac Brand Hub | Coming Soon</title>

<style>
    :root {
        --dill: #4CAF50;
        --lime: #B6D64A;
        --cream: #FFF3D6;
        --black: #1A1A1A;
        --pink: #FF8BC7;
    }

    body {
        margin: 0;
        background: linear-gradient(135deg, var(--dill), var(--lime));
        font-family: 'Luckiest Guy', sans-serif;
        color: var(--cream);
        text-align: center;
        padding: 4em 1em;
    }

    header img.qr {
        width: 160px;
        display: block;
        margin: 0 auto 20px auto;
    }

    h1 {
        font-family: 'Boink Bold';
        font-size: 3em;
        margin-bottom: 0.3em;
    }

    p {
        font-size: 1.4em;
        font-family: 'Caveat Brush';
    }

    .logo-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
        margin-top: 2em;
    }

    .logo-grid img {
        width: 220px;
        height: auto;
        border: 3px solid var(--cream);
        border-radius: 10px;
        background: var(--cream);
    }

    .links a {
        display: inline-block;
        margin: 1em;
        padding: 0.5em 1em;
        border: 2px solid var(--cream);
        border-radius: 6px;
        color: var(--cream);
        text-decoration: none;
        font-size: 1.2em;
    }

    .links a:hover {
        background: var(--cream);
        color: var(--black);
    }
</style>
</head>

<body>

<header>
    <img class="qr" src="images/qr.png" alt="QR Code">
</header>

<h1>BRINE‑iac Brand Hub</h1>
<p>All assets. All flavors. All brains. Coming Soon.</p>

<div class="logo-grid">
    <img src="images/logo-main.png" alt="Primary Logo">
    <img src="images/logo-simple.png" alt="Simplified Logo">
    <img src="images/mascot-1.png" alt="Mascot Pose 1">
    <img src="images/mascot-2.png" alt="Mascot Pose 2">
</div>

<div class="links">
    <a href="index.html">Return to Main Site</a>
    <a href="https://www.instagram.com/brine_iacpickles">Instagram</a>
    <a href="https://www.kickstarter.com/projects/brine-iac/brine-iac-pickles">Kickstarter</a>
</div>

</body>
</html>
